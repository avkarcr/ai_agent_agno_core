[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-agno-core"
version = "0.1.0"
description = "Local-first monitoring platform with Agno agents"
requires-python = ">=3.11"
dependencies = ["agno>=2,<3", "apscheduler>=3.10,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "feedparser>=6,<7", "pydantic-settings>=2.5,<3", "ollama>=0.5,<1"]

[project.optional-dependencies]
openai = ["openai>=1.99,<3"]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["agno_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
